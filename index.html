<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#b45309" />
    <meta
      name="description"
      content="Osobní sbírka receptů, která umí i počítat kalorie. Rychlé zachycení, offline."
    />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <title>Osobní kuchařka</title>
    <!-- Motiv (UC025): aplikuj synchronně před vykreslením, ať nebliká bílá (FOUC).
         Zrcadlí logiku src/lib/theme.ts (klíč kucharka-theme). -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('kucharka-theme');
          var dark =
            pref === 'dark' ||
            ((pref === null || pref === 'system') &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#1c1917' : '#b45309');
        } catch (e) {
          /* soukromý režim / blokované úložiště – zůstane světlý */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
